[pytest]
# The application packages live under src/ (see src/watchtower/*).
pythonpath = src
testpaths = tests
addopts = -ra
# An xfail marker is only ever used for a genuine defect found in src/, so an
# unexpectedly passing test must fail the run rather than silently hide a fix.
xfail_strict = true
filterwarnings =
    ignore:.*'datetime.datetime.utcnow.*':DeprecationWarning
